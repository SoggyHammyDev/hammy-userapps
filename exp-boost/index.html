<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy EXP Boosts</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="exp-redeemer">
    <header id="exp-header">
      <div class="header-left">
        <span class="app-icon">⚡</span>
        <div class="header-copy">
          <div class="title-row">
            <span>EXP Boosts</span>
            <span class="version-badge">v2</span>
          </div>
          <span class="subtitle"><span id="boost-count">0</span> boost types detected</span>
        </div>
      </div>
      <button id="close" class="icon-btn" title="Close" aria-label="Close">×</button>
    </header>

    <div id="exp-content">
      <div id="boost-summary" class="summary-card empty">
        <div>
          <span class="summary-label">Inventory Status</span>
          <strong id="boost-status">No EXP boosts detected</strong>
        </div>
        <span id="total-boosts" class="count-pill">0</span>
      </div>

      <button id="open-ui" class="btn btn-primary" style="display:none;">Choose Boosts</button>

      <div id="popup" class="hidden">
        <div class="popup-head">
          <div>
            <strong>Available Boosts</strong>
            <span>Select one or more to redeem.</span>
          </div>
        </div>

        <form id="exp-form"></form>

        <div class="popup-actions">
          <button id="redeem-btn" class="btn btn-primary">Redeem Selected</button>
          <button id="cancel-btn" type="button" class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
  </section>

  <button id="exp-toggle-btn" class="hidden toggle-btn" title="Open EXP Boost UI" aria-label="Open EXP Boost UI">⚡</button>

  <script src="script.js?v=20260920"></script>
</body>
</html>
