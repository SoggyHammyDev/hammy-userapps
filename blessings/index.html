<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy Blessings</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="tracker" aria-label="Blessing Auto Opener">
    <header class="tracker-header" id="tracker-header">
      <div class="header-left">
        <span class="app-icon">✦</span>
        <div class="header-copy">
          <div class="title-row">
            <span>Blessing Opener</span>
            <span class="version-badge">v2</span>
          </div>
          <span class="subtitle">Pack automation</span>
        </div>
      </div>
      <span id="run-state" class="state-pill idle"><i></i> IDLE</span>
    </header>

    <div class="content">
      <div class="count-grid">
        <article class="count-card count">
          <span class="count-label">Series 1</span>
          <strong id="count-s1">0</strong>
        </article>
        <article class="count-card count">
          <span class="count-label">Series 2</span>
          <strong id="count-s2">0</strong>
        </article>
        <article class="count-card count">
          <span class="count-label">Series 3</span>
          <strong id="count-s3">0</strong>
        </article>
        <article class="count-card count cursed">
          <span class="count-label">Cursed Dice</span>
          <strong id="count-cursed">0</strong>
        </article>
      </div>

      <div class="settings-list">
        <label class="setting-row">
          <div>
            <strong>Auto Redeem</strong>
            <small>Redeem blessings after packs finish opening.</small>
          </div>
          <span class="switch">
            <input type="checkbox" id="auto-redeem">
            <span class="switch-track"></span>
          </span>
        </label>

        <label class="setting-row">
          <div>
            <strong>Delete Failed</strong>
            <small>Trash blessings that cannot be received.</small>
          </div>
          <span class="switch">
            <input type="checkbox" id="auto-delete">
            <span class="switch-track"></span>
          </span>
        </label>
      </div>

      <div class="action-grid">
        <button id="start-btn" class="btn btn-start">Start Opening</button>
        <button id="stop-btn" class="btn btn-stop" style="display:none;">Stop Opening</button>
        <button id="redeem-btn" class="btn btn-redeem">Redeem Blessings</button>
      </div>

      <p class="footnote">Requires Cursed Dice while opening blessing packs.</p>
    </div>
  </section>

  <script src="script.js?v=20260920"></script>
</body>
</html>
