<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy XP Tracker v2</title>
  <link rel="shortcut icon" href="https://tidalfaction.com/tidal.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="tracker-app" class="tracker" style="left:40px;top:40px;">
    <header id="drag-handle" class="header">
      <div class="header-left">
        <span class="logo">⚡</span>
        <div>
          <div class="title">XP Tracker <span class="version">v2.1</span></div>
          <div id="connection-status" class="status">Waiting for Transport Tycoon…</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="icon-btn" title="Refresh data">↻</button>
        <button id="jobs-btn" class="icon-btn" title="Choose skills">☰</button>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
        <button id="minimize-btn" class="icon-btn" title="Minimize">−</button>
      </div>
    </header>

    <div id="body" class="body">
      <div class="session-strip">
        <div class="mini-stat"><span>Session</span><strong id="session-time">00:00:00</strong></div>
        <div class="mini-stat"><span>Total gain</span><strong id="session-total-gain">0 XP</strong></div>
        <div class="mini-stat"><span>Active</span><strong id="active-skill">—</strong></div>
      </div>

      <div id="job-picker" class="job-picker hidden">
        <div class="picker-head">
          <strong>Skills shown</strong>
          <div>
            <button id="select-all" class="text-btn">All</button>
            <button id="select-none" class="text-btn">None</button>
          </div>
        </div>
        <div id="job-list" class="job-list"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="summary-head"></thead>
          <tbody id="summary-body">
            <tr><td class="empty">Waiting for XP data…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <aside id="settings-panel" class="settings hidden">
      <div class="settings-title">Display</div>
      <label><input id="show-level" type="checkbox" checked> Level</label>
      <label><input id="show-bxp" type="checkbox" checked> BXP</label>
      <label><input id="show-gain" type="checkbox" checked> Session gain</label>
      <label><input id="show-rate" type="checkbox" checked> XP/hour</label>
      <label><input id="show-eta" type="checkbox" checked> ETA to next level</label>
      <label><input id="show-progress" type="checkbox" checked> Level progress</label>
      <label><input id="highlight-active" type="checkbox" checked> Highlight active skill</label>

      <div class="divider"></div>
      <label class="range-label">Font size <span id="font-size-value">11px</span></label>
      <input id="font-size" type="range" min="9" max="15" value="11">

      <div class="divider"></div>
      <button id="reset-session" class="danger-btn">Reset session baseline</button>
    </aside>

    <div id="resize-handle" title="Resize"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
