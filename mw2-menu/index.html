<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy MW2 Menu</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="app" class="mw2-app" aria-label="Hammy MW2 Menu">
    <div class="scene" aria-hidden="true">
      <div class="smoke smoke-a"></div>
      <div class="smoke smoke-b"></div>
      <div class="warm-glow"></div>
      <div class="operator-silhouette"></div>
      <div class="grain"></div>
    </div>

    <div id="dragHandle" class="menu-slab">
      <div class="menu-inner">
        <div class="campaign-title">"HAMMY TOOLS"</div>
        <div class="campaign-subtitle">TRANSPORT TYCOON</div>

        <nav aria-label="MW2 menu">
          <div id="menuList" class="menu-list"></div>
        </nav>

        <div id="selectedDescription" class="selected-description"></div>
      </div>
    </div>

    <div class="brand-mark" aria-hidden="true">
      <span>HAMMY</span>
      <strong>TT</strong>
    </div>

    <div class="bottom-help">
      <span><kbd>↑</kbd><kbd>↓</kbd> MOVE</span>
      <span><kbd>ENTER</kbd> SELECT</span>
      <span><kbd>ESC</kbd> PIN</span>
    </div>

    <div class="status-corner">
      <span id="pinState">UNPINNED</span>
      <span id="clock">00:00</span>
    </div>

    <section id="detailPanel" class="sr-only" aria-live="polite">
      <h2 id="detailTitle"></h2>
      <p id="detailDescription"></p>
      <div id="detailBody"></div>
      <button id="primaryAction" type="button">SELECT</button>
    </section>
  </section>

  <button id="showButton" class="show-button hidden" type="button" aria-label="Open Hammy MW2 Menu">H</button>

  <script src="script.js"></script>
</body>
</html>
