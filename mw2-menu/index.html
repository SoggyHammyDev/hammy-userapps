<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy MW2 Menu</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="app" class="mw2-app" aria-label="Hammy MW2 Menu">
    <div id="dragHandle" class="floating-shell">
      <div class="floating-topline">TRANSPORT TYCOON</div>
      <div class="floating-title">"HAMMY TOOLS"</div>
      <div class="floating-subtitle">MAIN MENU</div>

      <nav class="floating-nav" aria-label="MW2 menu">
        <div id="menuList" class="menu-list"></div>
      </nav>

      <div id="selectedDescription" class="selected-description"></div>

      <div class="floating-footer">
        <span id="pinState">UNPINNED</span>
        <span id="clock">00:00</span>
      </div>
    </div>

    <section id="detailPanel" class="sr-only" aria-live="polite">
      <h2 id="detailTitle"></h2>
      <p id="detailDescription"></p>
      <div id="detailBody"></div>
      <button id="primaryAction" type="button">SELECT</button>
    </section>
  </section>

  <button id="showButton" class="show-button hidden" type="button" aria-label="Open Hammy MW2 Menu">H</button>

  <script src="script.js"></script>
</body>
</html>
