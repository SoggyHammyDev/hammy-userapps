<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy MW2 Menu</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="app" class="mw2-app" aria-label="Hammy MW2 Menu">
    <div class="noise" aria-hidden="true"></div>

    <header id="dragHandle" class="mw2-header">
      <div>
        <div class="eyebrow">TRANSPORT TYCOON</div>
        <div class="title-row">
          <h1>HAMMY <span>MENU</span></h1>
          <span class="version">v1.0</span>
        </div>
        <div id="breadcrumb" class="breadcrumb">MULTIPLAYER  /  TT TOOLS</div>
      </div>

      <div class="header-status">
        <span id="pinState" class="pin-state">UNPINNED</span>
        <span class="online-dot"></span>
      </div>
    </header>

    <main class="menu-layout">
      <nav class="menu-column" aria-label="Main menu">
        <div id="menuList" class="menu-list"></div>
      </nav>

      <section id="detailPanel" class="detail-panel" aria-live="polite">
        <div class="detail-kicker">INTEL</div>
        <h2 id="detailTitle">TT TOOLBOX</h2>
        <p id="detailDescription">Select a category to view details.</p>

        <div id="detailBody" class="detail-body"></div>

        <button id="primaryAction" class="mw2-action" type="button">SELECT</button>
      </section>
    </main>

    <footer class="mw2-footer">
      <div class="controls">
        <span><kbd>↑</kbd><kbd>↓</kbd> NAVIGATE</span>
        <span><kbd>ENTER</kbd> SELECT</span>
        <span><kbd>ESC</kbd> PIN / UNPIN</span>
      </div>
      <div id="clock" class="clock">00:00</div>
    </footer>
  </section>

  <button id="showButton" class="show-button hidden" type="button" aria-label="Open Hammy MW2 Menu">H</button>

  <script src="script.js"></script>
</body>
</html>
