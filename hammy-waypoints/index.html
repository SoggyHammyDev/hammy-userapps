<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy Waypoints</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="toggleBtn" class="toggle-btn" title="Open Waypoints" aria-label="Open Waypoints">📍</button>

  <section id="app" class="waypoint-panel hidden" aria-hidden="true">
    <header class="panel-header">
      <div class="header-left">
        <span class="app-icon">📍</span>
        <div class="header-copy">
          <div class="title-row">
            <span>Hammy Waypoints</span>
            <span class="version-badge">v2</span>
          </div>
          <span id="greeting" class="subtitle">Heya …</span>
        </div>
      </div>
      <button id="closeBtn" class="icon-btn" title="Close (Esc)" aria-label="Close">×</button>
    </header>

    <div class="content">
      <div class="coord-card">
        <div class="coord-head">
          <span>Current Position</span>
          <button id="refreshBtn" class="icon-btn small" title="Refresh coordinates" aria-label="Refresh coordinates">↻</button>
        </div>
        <span id="coordStatus" class="coord-status">Click refresh for coords</span>
        <div class="input-grid">
          <label class="field">
            <span>X</span>
            <input id="x" type="number" placeholder="0.000" step="any">
          </label>
          <label class="field">
            <span>Y</span>
            <input id="y" type="number" placeholder="0.000" step="any">
          </label>
        </div>
      </div>

      <div class="save-row">
        <input id="labelInput" type="text" placeholder="Waypoint label (optional)" maxlength="32">
        <button id="saveBtn" class="btn btn-save">Save</button>
      </div>

      <div class="library-card">
        <div class="library-head">
          <span>Saved Waypoints</span>
          <select id="sortSelect">
            <option value="alphabetical">A–Z</option>
            <option value="distance">Distance</option>
          </select>
        </div>

        <select id="wpSelect" class="waypoint-select">
          <option value="">— Select waypoint —</option>
        </select>

        <div class="action-grid">
          <button id="loadBtn" class="btn btn-load">Load Waypoint</button>
          <button id="deleteBtn" class="btn btn-delete" title="Delete selected">Delete</button>
        </div>
      </div>

      <div id="lastAction" class="status-message"></div>
    </div>
  </section>

  <script src="app.js?v=20260920"></script>
</body>
</html>
