<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy Mining Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="dashboard-container" id="draggableWindow">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-title">
          <span class="app-icon">⛏</span>
          <div class="title-copy">
            <div class="title-row">
              <span>Mining Helper</span>
              <span class="version-badge">v2</span>
            </div>
            <span class="subtitle">Live quarry session</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="header-btn" id="layoutBtn" title="Switch layout" aria-label="Switch layout">↔</button>
          <button class="header-btn" id="minimizeBtn" title="Minimize" aria-label="Minimize">−</button>
        </div>
      </div>
    </header>

    <div class="dashboard-content">
      <div class="left-column">
        <section class="inventory-card compact-card">
          <div class="card-heading">
            <span class="eyebrow">Inventory</span>
            <strong id="inv-percent">--%</strong>
          </div>

          <div class="progress-bar" aria-label="Inventory capacity">
            <div class="progress-fill" id="inventoryProgress"></div>
          </div>

          <div class="inventory-details">
            <span><strong id="inv-current">--</strong> kg</span>
            <span class="muted">of <strong id="inv-max">--</strong> kg</span>
          </div>
        </section>

        <section class="bxp-card compact-card">
          <div>
            <span class="eyebrow">Mining BXP</span>
            <div class="bxp-value" id="total-bxp">0</div>
          </div>
          <span class="token-mark">BXP</span>
        </section>
      </div>

      <section class="ore-grid">
        <article class="ore-card copper-card">
          <div class="ore-header">
            <div>
              <span class="ore-kicker">Copper</span>
              <h2>Copper Ore</h2>
            </div>
            <span class="ore-dot"></span>
          </div>

          <div class="ore-total">
            <span id="copper-total">0</span>
            <small>in inventory</small>
          </div>

          <div class="ore-stats">
            <div class="stat-item">
              <span class="stat-label">Vouchers</span>
              <strong class="stat-value" id="copper-vouchers">0</strong>
            </div>
            <div class="stat-item">
              <span class="stat-label">Per hour</span>
              <strong class="stat-value" id="copper-hr">0</strong>
            </div>
            <div class="stat-item">
              <span class="stat-label">Per min</span>
              <strong class="stat-value" id="copper-min">0</strong>
            </div>
          </div>
        </article>

        <article class="ore-card iron-card">
          <div class="ore-header">
            <div>
              <span class="ore-kicker">Iron</span>
              <h2>Iron Ore</h2>
            </div>
            <span class="ore-dot"></span>
          </div>

          <div class="ore-total">
            <span id="iron-total">0</span>
            <small>in inventory</small>
          </div>

          <div class="ore-stats">
            <div class="stat-item">
              <span class="stat-label">Vouchers</span>
              <strong class="stat-value" id="iron-vouchers">0</strong>
            </div>
            <div class="stat-item">
              <span class="stat-label">Per hour</span>
              <strong class="stat-value" id="iron-hr">0</strong>
            </div>
            <div class="stat-item">
              <span class="stat-label">Per min</span>
              <strong class="stat-value" id="iron-min">0</strong>
            </div>
          </div>
        </article>
      </section>

      <section class="performance-section">
        <div class="section-title">
          <span>Session</span>
          <span class="live-pill"><i></i> LIVE</span>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-label">Runtime</span>
            <strong class="metric-value" id="session-time">00:00:00</strong>
          </div>
          <div class="metric-card">
            <span class="metric-label">Ore tracked</span>
            <strong class="metric-value" id="total-mined">0</strong>
          </div>
          <div class="metric-card">
            <span class="metric-label">Vouchers</span>
            <strong class="metric-value" id="total-vouchers">0</strong>
          </div>
        </div>
      </section>
    </div>
  </section>

  <script src="mining-tracker.js"></script>
</body>
</html>
