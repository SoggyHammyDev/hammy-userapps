<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy BXP</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="app" id="app">
    <header id="dragHandle">
      <div class="brand">
        <div class="icon">⚡</div>
        <div>
          <div class="title">Hammy BXP <span>v0.2</span></div>
          <div class="subtitle">Trunk Loader</div>
        </div>
      </div>
      <div class="live"><i></i> READY</div>
    </header>

    <main>
      <div class="field">
        <label for="bxpType">BXP Type</label>
        <select id="bxpType">
          <option value="hunting">Hunting</option>
        </select>
      </div>

      <div class="cargo">
        <div>
          <span>Cargo</span>
          <strong id="cargoName">Fridge: Food Shipment</strong>
        </div>
        <div class="pill">10 BXP ea.</div>
      </div>

      <div class="stats">
        <div>
          <span>Storage</span>
          <strong id="storageAmount">—</strong>
        </div>
        <div>
          <span>Detected Trunks</span>
          <strong id="trunkCount">—</strong>
        </div>
      </div>

      <div class="status" id="status">
        <i></i>
        <div>
          <strong id="statusTitle">Waiting for Self Storage</strong>
          <span id="statusText">Open Self Storage, then press your Hammy BXP keybind.</span>
        </div>
      </div>

      <button id="loadNow" type="button">Load Trunks Now</button>

      <div class="hint">
        FiveM Settings → Key Bindings → <strong>Hammy BXP Load</strong>
      </div>
    </main>
  </section>
  <script src="app.js"></script>
</body>
</html>
