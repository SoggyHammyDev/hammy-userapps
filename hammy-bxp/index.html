<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy BXP</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="app" id="app">
    <header id="dragHandle">
      <div class="brand">
        <div class="icon">⚡</div>
        <div>
          <div class="title">Hammy BXP <span>v0.9</span></div>
          <div class="subtitle">Trunk Loader</div>
        </div>
      </div>
      <div class="live"><i></i> READY</div>
    </header>

    <main>
      <div class="field">
        <label for="bxpType">BXP Type</label>
        <select id="bxpType">
          <option value="hunting">Hunting</option>
        </select>
      </div>

      <section class="settings-card">
        <label class="check-row">
          <span>
            <strong>Dump trunk(s) before take</strong>
            <small>Empty each selected trunk into storage first.</small>
          </span>
          <input id="dumpBeforeTake" type="checkbox">
        </label>

        <label class="check-row">
          <span>
            <strong>Using MK15</strong>
            <small>Also load the Chernobog Toter cab.</small>
          </span>
          <input id="useMk15" type="checkbox" checked>
        </label>

        <div class="trailer-row">
          <div>
            <strong>Trailer</strong>
            <small>Doggos trailer legend</small>
          </div>
          <select id="trailerSelect">
            <option value="">None</option>
            <option value="trailerswb">MK1</option>
            <option value="trailerlogs2">MK3</option>
            <option value="botdumptr">MK4</option>
            <option value="drybulktr">MK5</option>
            <option value="dumptr">MK6</option>
            <option value="docktrailer2">MK7</option>
            <option value="docktrailer">MK8</option>
            <option value="trailers2">MK9</option>
            <option value="trailerswb2">MK10 · Refrigerated Trailer</option>
            <option value="tvtrailer">MK11</option>
            <option value="tvtrailer2">MK12</option>
            <option value="boxlongtr">MK13 · Box Trailer</option>
            <option value="trailerlarge" selected>MK14 · Mobile Operations Center</option>
          </select>
        </div>
      </section>

      <div class="cargo">
        <div>
          <span>Cargo</span>
          <strong id="cargoName">Fridge: Food Shipment</strong>
        </div>
        <div class="pill">10 BXP ea.</div>
      </div>

      <div class="stats">
        <div>
          <span>Storage</span>
          <strong id="storageAmount">—</strong>
        </div>
        <div>
          <span>Load Progress</span>
          <strong id="trunkCount">—</strong>
        </div>
      </div>

      <div class="status" id="status">
        <i></i>
        <div>
          <strong id="statusTitle">Waiting for Self Storage</strong>
          <span id="statusText">Press your Hammy BXP keybind, then open Self Storage within 3 seconds.</span>
        </div>
      </div>

      <button id="loadNow" type="button">Arm Loader</button>

      <div class="hint">
        FiveM Settings → Key Bindings → <strong>Hammy BXP Load</strong>
      </div>
    </main>
  </section>
  <script src="app.js"></script>
</body>
</html>
