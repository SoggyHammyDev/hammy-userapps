<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy BXP Tracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="tracker-app" class="new-ui" style="position:absolute;left:40px;top:40px;">
    <header id="drag-handle">
      <div class="header-left">
        <span class="app-icon">✦</span>
        <div class="header-copy">
          <div class="title-row">
            <span>BXP Tracker</span>
            <span class="version-badge">v2</span>
          </div>
          <span class="subtitle"><span id="selected-job-count">0</span> jobs tracked</span>
        </div>
      </div>
      <button id="settings-icon" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <main>
      <section id="job-select-section">
        <button id="toggle-job-list" class="section-toggle" type="button">
          <span>Tracked Jobs</span>
          <span id="job-list-arrow">›</span>
        </button>
        <div id="job-list" style="display:none;"></div>
      </section>

      <section id="bxp-summary-section">
        <table id="bxp-summary-table">
          <thead>
            <tr><th>Job</th><th>BXP</th><th>BXP/hr</th><th>BXP/min</th></tr>
          </thead>
          <tbody id="summary-tbody"></tbody>
        </table>
        <div id="empty-state">Select one or more jobs to begin tracking.</div>
      </section>
    </main>

    <div id="resize-handle" title="Resize"></div>
  </section>

  <aside id="settings-panel" style="display:none;">
    <div class="settings-header">
      <div>
        <strong>Tracker Settings</strong>
        <span>Display & session controls</span>
      </div>
      <button id="close-settings" class="icon-btn" type="button" aria-label="Close settings">×</button>
    </div>

    <label class="setting-row">
      <span>
        <strong>Show BXP/hr</strong>
        <small>Display estimated hourly rate.</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="toggle-bxp-hr" checked>
        <span class="switch-track"></span>
      </span>
    </label>

    <label class="setting-row">
      <span>
        <strong>Show BXP/min</strong>
        <small>Display estimated per-minute rate.</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="toggle-bxp-min" checked>
        <span class="switch-track"></span>
      </span>
    </label>

    <div class="range-card">
      <div class="range-head">
        <label for="bxp-font-size">Row Size</label>
        <span><b id="bxp-font-size-value">13</b>px</span>
      </div>
      <input type="range" id="bxp-font-size" min="12" max="36" value="13" step="1">
    </div>

    <div class="settings-actions">
      <button id="reloadButton" class="settings-btn">Reload UI</button>
      <button id="reset-bxp-log" class="settings-btn danger">Reset Tracking</button>
    </div>
  </aside>

  <script src="script.js?v=20260920"></script>
</body>
</html>
