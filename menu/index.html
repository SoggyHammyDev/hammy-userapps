<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy Menu Styler</title>
  <link rel="icon" href="data:,">
  <style>
    :root{
      --bg:rgba(8,12,18,.97);
      --panel:rgba(255,255,255,.045);
      --line:rgba(255,255,255,.09);
      --text:#edf6ff;
      --muted:#8393a8;
      --cyan:#38bdf8;
      --green:#34d399;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      color:var(--text)
    }
    button,input{font:inherit}
    .hidden{display:none!important}
    .app{
      position:fixed;left:18px;top:18px;width:318px;
      border:1px solid var(--line);border-radius:14px;overflow:hidden;
      background:linear-gradient(160deg,rgba(15,23,34,.98),var(--bg));
      box-shadow:0 14px 40px rgba(0,0,0,.38);user-select:none;
    }
    header{
      min-height:54px;padding:10px 12px;display:flex;align-items:center;
      justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);cursor:move;
    }
    .brand{display:flex;align-items:center;gap:9px}
    .icon{
      width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
      border:1px solid rgba(56,189,248,.18);background:rgba(56,189,248,.08);font-size:15px;
    }
    .title{font-size:12px;font-weight:900;letter-spacing:-.01em}
    .title span{margin-left:4px;color:var(--muted);font-size:7px;font-weight:800}
    .subtitle{margin-top:1px;color:var(--muted);font-size:8px}
    .header-actions{display:flex;align-items:center;gap:6px}
    .live{
      display:flex;align-items:center;gap:5px;color:#bfead9;
      font-size:7px;font-weight:900;letter-spacing:.08em;
    }
    .live i{
      width:6px;height:6px;border-radius:50%;background:var(--green);
      box-shadow:0 0 8px rgba(52,211,153,.65)
    }
    .icon-btn{
      width:28px;height:28px;padding:0;display:grid;place-items:center;
      border:1px solid var(--line);border-radius:8px;
      background:rgba(255,255,255,.045);color:var(--text);cursor:pointer;font-size:12px;
    }
    .icon-btn:hover{background:rgba(255,255,255,.09)}
    main{padding:11px}
    .settings-card{
      padding:4px 9px;margin-bottom:8px;background:var(--panel);
      border:1px solid var(--line);border-radius:10px;
    }
    .check-row{
      min-height:42px;display:flex;align-items:center;justify-content:space-between;
      gap:10px;cursor:pointer;
    }
    .check-row+.check-row{border-top:1px solid rgba(255,255,255,.06)}
    .check-row strong{display:block;font-size:8px;font-weight:850}
    .check-row small{display:block;margin-top:2px;color:var(--muted);font-size:7px}
    .check-row input{width:15px;height:15px;flex:none;accent-color:var(--cyan)}
    #applyBtn{
      width:100%;min-height:34px;border:1px solid rgba(56,189,248,.2);border-radius:9px;
      color:#e9f8ff;background:rgba(56,189,248,.10);font-size:9px;font-weight:900;cursor:pointer;
    }
    #applyBtn:hover{background:rgba(56,189,248,.16)}
    .hint{
      margin-top:8px;text-align:center;color:var(--muted);
      font-size:7px;line-height:1.35;
    }
    .hint strong{color:#cdeeff}
    .toggle-btn{
      position:fixed;right:24px;bottom:76px;width:40px;height:40px;
      display:grid;place-items:center;padding:0;z-index:9999;
      border:1px solid rgba(56,189,248,.18);border-radius:11px;
      background:linear-gradient(145deg,rgba(8,12,18,.97),rgba(17,24,35,.985));
      color:#d9f4ff;box-shadow:0 12px 32px rgba(0,0,0,.32);
      cursor:pointer;font-size:15px;
    }
    .toggle-btn:hover{background:#171f2b}
  </style>
</head>
<body>
  <section class="app" id="app">
    <header id="dragHandle">
      <div class="brand">
        <div class="icon">☰</div>
        <div>
          <div class="title">Hammy Menu Styler <span>v0.15</span></div>
          <div class="subtitle">TT UI Theme</div>
        </div>
      </div>

      <div class="header-actions">
        <div class="live"><i></i> ACTIVE</div>
        <button id="hideBtn" class="icon-btn" type="button" title="Hide" aria-label="Hide">×</button>
      </div>
    </header>

    <main>
      <section class="settings-card">
        <label class="check-row">
          <span>
            <strong>Enable UI styling</strong>
            <small>Theme menus, chat, HUD blocks and Player List.</small>
          </span>
          <input id="enabled" type="checkbox" checked>
        </label>

        <label class="check-row">
          <span>
            <strong>Auto apply on launch</strong>
            <small>Restore the Hammy theme whenever the app loads.</small>
          </span>
          <input id="autoApply" type="checkbox" checked>
        </label>
      </section>

      <button id="applyBtn" type="button">Apply Hammy Theme</button>

      <div class="hint">
        FiveM keybind: <strong>Toggle Hammy Menu Styler</strong><br>
        ESC pins/unpins this app.
      </div>
    </main>
  </section>

  <button id="showBtn" class="toggle-btn hidden" type="button"
    title="Open Hammy Menu Styler" aria-label="Open Hammy Menu Styler">☰</button>

      const CHAT_FRAME_CSS = `
        :root{
          --hammy-bg:rgba(8,12,18,.94);

        }
        .chat-window-wrapper{
          margin:0!important;
        }
        .chat-btn-wrapper{
          margin:0 0 5px!important;
        }
        .chat-input textarea{
          color:var(--hammy-text)!important;
          background:rgba(255,255,255,.035)!important;
          border:1px solid rgba(255,255,255,.07)!important;

        }
        .chat-input textarea::placeholder{color:var(--hammy-muted)!important}
        .prefix{
          color:var(--hammy-cyan)!important;
          left:10px!important;
          margin-top:6px!important;
        }
        .suggestions{
          background:var(--hammy-panel)!important;color:var(--hammy-text)!important;
          border-top:1px solid var(--hammy-line)!important;
          padding:7px 9px 7px 28px!important;font-size:.95rem!important;
        }
        .suggestion{margin-bottom:4px!important}
        .help,.disabled{color:var(--hammy-muted)!important}
        .chat-btn{
          background:rgba(255,255,255,.035)!important;
          color:#c8d6e6!important;
          border:1px solid transparent!important;
          transition:background .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease!important;
        }
        .chat-btn:hover{
          background:rgba(56,189,248,.10)!important;
          color:#eefaff!important;
        }
        .chat-btn.on,
        .chat-btn.channelSelected,
        .channelSelected{
          background:rgba(56,189,248,.18)!important;
          border-color:rgba(56,189,248,.34)!important;
          color:#ffffff!important;
          font-weight:900!important;
          box-shadow:

            0 0 10px rgba(56,189,248,.16)!important;

      `;

      const PLAYERLIST_FRAME_CSS = `
        :root{
          --hammy-bg:rgba(8,12,18,.96);
          --hammy-panel:rgba(15,23,34,.98);
          --hammy-line:rgba(255,255,255,.09);

      `;

      function sendCss(css) {
        window.parent.postMessage({
          type: "setDivCss",
          div: "additional_css",
          css
        }, "*");
      }

      function findFrameDocument(match) {
        try {
          const topDoc = window.top.document;
          const frames = Array.from(topDoc.querySelectorAll("iframe,frame"));
          for (const frame of frames) {
            try {
              const doc = frame.contentDocument || frame.contentWindow?.document;
              const href = doc?.location?.href || "";
              if (doc && match(href)) return doc;
            } catch {}
          }
        } catch {}
        return null;
      }

      function injectFrameStyle(doc, id, css) {
        if (!doc) return false;
        try {
          let style = doc.getElementById(id);
          if (!style) {
            style = doc.createElement("style");
            style.id = id;
            (doc.head || doc.documentElement).appendChild(style);
          }
          style.textContent = css;
          return true;
        } catch {
          return false;
        }
      }

      function removeFrameStyle(doc, id) {
        try { doc?.getElementById(id)?.remove(); } catch {}
      }

      function fixDarkPlayerNames(doc) {
        if (!doc) return;

        let candidates = [];
        try {
          candidates = Array.from(
            doc.querySelectorAll(
              "#playerlist .player .name, #playerlist .player .name *, " +
              "#playerlist .player [class*='name'], #playerlist .player [class*='name'] *"
            )
          );
        } catch {
          return;
        }

        for (const el of candidates) {
          try {
            const color = doc.defaultView.getComputedStyle(el).color;
            const match = color.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/i);
            if (!match) continue;

            const r = Number(match[1]);
            const g = Number(match[2]);
            const b = Number(match[3]);
            const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;

            if (luminance < 75) {
              el.style.setProperty("color", "#f4f8ff", "important");
              el.style.setProperty("-webkit-text-fill-color", "#f4f8ff", "important");
              el.style.setProperty("text-shadow", "none", "important");
              el.dataset.hammyBrightened = "1";
            }
          } catch {}
        }
      }

      function fixDarkChatText(doc) {
        if (!doc) return;

        let candidates = [];
        try {
          candidates = Array.from(
            doc.querySelectorAll(
              ".chat-messages .msg *, .chat-messages .multiline *, .chat-messages span"
            )
          );
        } catch {
          return;
        }

        for (const el of candidates) {
          try {
            const text = (el.textContent || "").trim();
            if (!text) continue;

            const color = doc.defaultView.getComputedStyle(el).color;
            const match = color.match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/i);
            if (!match) continue;

            const r = Number(match[1]);
            const g = Number(match[2]);
            const b = Number(match[3]);
            const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;

            if (luminance < 75) {
              el.style.setProperty("color", "#f4f8ff", "important");
              el.style.setProperty("-webkit-text-fill-color", "#f4f8ff", "important");
              el.style.setProperty("text-shadow", "none", "important");
              el.dataset.hammyChatBrightened = "1";
            }
          } catch {}
        }
      }

      let chatObserver = null;
      let observedChatDoc = null;

      function ensureChatObserver(doc) {
        if (!doc) return;

        if (observedChatDoc === doc && chatObserver) return;

        try {
          chatObserver?.disconnect();
        } catch {}

        observedChatDoc = doc;

        try {
          const root = doc.querySelector(".chat-messages") || doc.body;
          if (!root) return;

          chatObserver = new doc.defaultView.MutationObserver(() => {
            fixDarkChatText(doc);
          });

          chatObserver.observe(root, {
            childList: true,
            subtree: true,
            characterData: true,
            attributes: true,
            attributeFilter: ["style", "class"]
          });
        } catch {
          chatObserver = null;
          observedChatDoc = null;
        }
      }

      function applyFrameStyles() {
        const vrpDoc = findFrameDocument(href => href.includes("nui://vrp/gui/"));
        const chatDoc = findFrameDocument(href => href.includes("nui://chat/"));
        const playerDoc = findFrameDocument(href => href.includes("nui://es_playerlist/"));

        injectFrameStyle(vrpDoc, "hammy-vrp-theme", VRP_FRAME_CSS);
        injectFrameStyle(chatDoc, "hammy-chat-theme", CHAT_FRAME_CSS);
        injectFrameStyle(playerDoc, "hammy-playerlist-theme", PLAYERLIST_FRAME_CSS);

        ensureChatObserver(chatDoc);
        fixDarkChatText(chatDoc);
        fixDarkPlayerNames(playerDoc);
      }

      function resetFrameStyles() {
        try {
          chatObserver?.disconnect();
        } catch {}
        chatObserver = null;
        observedChatDoc = null;

        const vrpDoc = findFrameDocument(href => href.includes("nui://vrp/gui/"));
        const chatDoc = findFrameDocument(href => href.includes("nui://chat/"));
        const playerDoc = findFrameDocument(href => href.includes("nui://es_playerlist/"));

        removeFrameStyle(vrpDoc, "hammy-vrp-theme");
        removeFrameStyle(chatDoc, "hammy-chat-theme");
        removeFrameStyle(playerDoc, "hammy-playerlist-theme");

        try {
          chatDoc?.querySelectorAll("[data-hammy-chat-brightened='1']").forEach(el => {
            el.style.removeProperty("color");
            el.style.removeProperty("-webkit-text-fill-color");
            el.style.removeProperty("text-shadow");
            delete el.dataset.hammyChatBrightened;
          });
        } catch {}

        try {
          playerDoc?.querySelectorAll("[data-hammy-brightened='1']").forEach(el => {
            el.style.removeProperty("color");
            el.style.removeProperty("-webkit-text-fill-color");
            el.style.removeProperty("text-shadow");
            delete el.dataset.hammyBrightened;
          });
        } catch {}
      }

      function applyStyles() {
        if (!state.settings.enabled) return;
        sendCss(FULL_CSS);
        applyFrameStyles();
      }

      function resetStyles() {
        sendCss("");
        resetFrameStyles();
      }

      function saveSettings() {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
        } catch {}
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
          if (saved && typeof saved === "object") {
            if (typeof saved.enabled === "boolean") state.settings.enabled = saved.enabled;
            if (typeof saved.autoApply === "boolean") state.settings.autoApply = saved.autoApply;
          }
        } catch {}

        $("enabled").checked = state.settings.enabled;
        $("autoApply").checked = state.settings.autoApply;
      }

      function hideApp() {
        $("app").classList.add("hidden");
        $("showBtn").classList.remove("hidden");
      }

      function showApp() {
        $("app").classList.remove("hidden");
        $("showBtn").classList.add("hidden");
      }

      function toggleApp() {
        if ($("app").classList.contains("hidden")) showApp();
        else hideApp();
      }

      function setupDrag() {
        const app = $("app");
        const handle = $("dragHandle");

        try {
          const saved = JSON.parse(localStorage.getItem(POSITION_KEY) || "null");
          if (saved) {
            app.style.left = Math.max(0, Math.min(saved.x, window.innerWidth - app.offsetWidth)) + "px";
            app.style.top = Math.max(0, Math.min(saved.y, window.innerHeight - app.offsetHeight)) + "px";
          }
        } catch {}

        let dragging = false;
        let dx = 0;
        let dy = 0;

        handle.addEventListener("mousedown", event => {
          if (event.target.closest("button,input,label")) return;
          const rect = app.getBoundingClientRect();
          dragging = true;
          dx = event.clientX - rect.left;
          dy = event.clientY - rect.top;
          event.preventDefault();
        });

        document.addEventListener("mousemove", event => {
          if (!dragging) return;
          app.style.left = Math.max(0, Math.min(event.clientX - dx, window.innerWidth - app.offsetWidth)) + "px";
          app.style.top = Math.max(0, Math.min(event.clientY - dy, window.innerHeight - app.offsetHeight)) + "px";
        });

        document.addEventListener("mouseup", () => {
          if (!dragging) return;
          dragging = false;
          try {
            localStorage.setItem(POSITION_KEY, JSON.stringify({
              x: app.offsetLeft,
              y: app.offsetTop
            }));
          } catch {}
        });
      }

      window.addEventListener("message", event => {
        const raw = event.data;
        const data = raw?.data || raw;
        if (!data || typeof data !== "object") return;

        if (Object.prototype.hasOwnProperty.call(data, TOGGLE_TRIGGER_KEY)) {
          const value = data[TOGGLE_TRIGGER_KEY];

          if (
            state.keybindReady &&
            state.lastToggleTrigger !== undefined &&
            value !== state.lastToggleTrigger
          ) {
            toggleApp();
          }

          state.lastToggleTrigger = value;
        }
      });

      window.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          window.parent.postMessage({ type: "pin" }, "*");
        }
      });

      $("enabled").addEventListener("change", event => {
        state.settings.enabled = event.target.checked;
        saveSettings();

        if (state.settings.enabled) applyStyles();
        else resetStyles();
      });

      $("autoApply").addEventListener("change", event => {
        state.settings.autoApply = event.target.checked;
        saveSettings();
      });

      $("applyBtn").addEventListener("click", applyStyles);
      $("hideBtn").addEventListener("click", hideApp);
      $("showBtn").addEventListener("click", showApp);

      loadSettings();
      setupDrag();

      window.parent.postMessage({
        type: "registerTrigger",
        trigger: TOGGLE_TRIGGER,
        name: "Toggle Hammy Menu Styler"
      }, "*");

      window.parent.postMessage({ type: "getData" }, "*");

      setTimeout(() => {
        state.keybindReady = true;
      }, 2000);

      setInterval(() => {
        if (state.settings.enabled) applyFrameStyles();
      }, 1500);

      setTimeout(() => {
        if (state.settings.enabled && state.settings.autoApply) applyStyles();
      }, 500);
    })();
  </script>
</body>
</html>
