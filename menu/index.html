<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy Menu Styler</title>
  <link rel="icon" href="data:,">
  <style>
    :root{
      --bg:rgba(8,12,18,.97);
      --panel:rgba(255,255,255,.045);
      --line:rgba(255,255,255,.09);
      --text:#edf6ff;
      --muted:#8393a8;
      --cyan:#38bdf8;
      --green:#34d399;
      --amber:#fbbf24;
      --red:#fb7185;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      color:var(--text)
    }
    button,input{font:inherit}
    .app{
      position:fixed;left:18px;top:18px;width:318px;
      border:1px solid var(--line);border-radius:14px;overflow:hidden;
      background:linear-gradient(160deg,rgba(15,23,34,.98),var(--bg));
      box-shadow:0 14px 40px rgba(0,0,0,.38);user-select:none;
    }
    header{
      min-height:54px;padding:10px 12px;display:flex;align-items:center;
      justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);cursor:move;
    }
    .brand{display:flex;align-items:center;gap:9px}
    .icon{
      width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
      border:1px solid rgba(56,189,248,.18);background:rgba(56,189,248,.08);font-size:15px;
    }
    .title{font-size:12px;font-weight:900;letter-spacing:-.01em}
    .title span{margin-left:4px;color:var(--muted);font-size:7px;font-weight:800}
    .subtitle{margin-top:1px;color:var(--muted);font-size:8px}
    .live{display:flex;align-items:center;gap:5px;color:#bfead9;font-size:7px;font-weight:900;letter-spacing:.08em}
    .live i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.65)}
    main{padding:11px}
    .settings-card,.status,.diag{
      background:var(--panel);border:1px solid var(--line);border-radius:10px;
    }
    .settings-card{padding:4px 9px;margin-bottom:8px}
    .check-row{
      min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
    }
    .check-row+.check-row{border-top:1px solid rgba(255,255,255,.06)}
    .check-row strong{display:block;font-size:8px;font-weight:850}
    .check-row small{display:block;margin-top:2px;color:var(--muted);font-size:7px}
    .check-row input{width:15px;height:15px;flex:none;accent-color:var(--cyan)}
    .status{
      min-height:50px;padding:9px 10px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;
    }
    .status>i{width:7px;height:7px;flex:none;margin-top:4px;border-radius:50%;background:var(--amber)}
    .status strong{display:block;font-size:9px}
    .status span{display:block;margin-top:3px;color:var(--muted);font-size:8px;line-height:1.35}
    .status.ok>i{background:var(--green)}
    .status.busy>i{background:var(--cyan);box-shadow:0 0 8px rgba(56,189,248,.55)}
    .status.error>i{background:var(--red)}
    .diag{
      display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:8px;overflow:hidden;
    }
    .diag>div{padding:8px 9px}
    .diag>div+div{border-left:1px solid var(--line)}
    .diag span{display:block;color:var(--muted);font-size:7px;text-transform:uppercase;letter-spacing:.06em;font-weight:850}
    .diag strong{display:block;margin-top:3px;font-size:12px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
    button{
      min-height:34px;border-radius:9px;font-size:9px;font-weight:900;cursor:pointer;
      color:#e9f8ff;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.2);
    }
    button:hover{background:rgba(56,189,248,.16)}
    button.secondary{color:#eafff6;background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.2)}
    button.secondary:hover{background:rgba(52,211,153,.16)}
    button.danger{color:#ffeef2;background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.18)}
    button.danger:hover{background:rgba(251,113,133,.14)}
    .full{width:100%;margin-bottom:7px}
    .hint{text-align:center;color:var(--muted);font-size:7px;line-height:1.35}
    .hint strong{color:#cdeeff}
  </style>
</head>
<body>
  <section class="app" id="app">
    <header id="dragHandle">
      <div class="brand">
        <div class="icon">☰</div>
        <div>
          <div class="title">Hammy Menu Styler <span>v0.4</span></div>
          <div class="subtitle">TT HUD / Menu Diagnostics</div>
        </div>
      </div>
      <div class="live"><i></i> READY</div>
    </header>

    <main>
      <section class="settings-card">
        <label class="check-row">
          <span>
            <strong>Enable HUD styling</strong>
            <small>Apply the Hammy theme to TT menus and HUD blocks.</small>
          </span>
          <input id="enabled" type="checkbox" checked>
        </label>

        <label class="check-row">
          <span>
            <strong>Auto apply on launch</strong>
            <small>Send the CSS automatically when this userapp opens.</small>
          </span>
          <input id="autoApply" type="checkbox" checked>
        </label>
      </section>

      <div class="status" id="status">
        <i></i>
        <div>
          <strong id="statusTitle">Ready</strong>
          <span id="statusText">Use Test Injection first to verify TT still accepts setDivCss.</span>
        </div>
      </div>

      <div class="diag">
        <div>
          <span>CSS Sends</span>
          <strong id="sendCount">0</strong>
        </div>
        <div>
          <span>Parent Events</span>
          <strong id="eventCount">0</strong>
        </div>
      </div>

      <div class="actions">
        <button id="applyBtn" type="button">Apply Styles</button>
        <button id="testBtn" type="button" class="secondary">Test Menu</button>
      </div>

      <div class="actions">
        <button id="testPlayersBtn" type="button" class="secondary">Test Player List</button>
        <button id="testChatBtn" type="button" class="secondary">Test Chat / Input</button>
      </div>

      <button id="scopeBtn" type="button" class="secondary full">Scope Test: Outline Reachable TT UI</button>
      <button id="resetBtn" type="button" class="danger full">Reset Injected CSS</button>

      <div class="hint">
        Open the target TT UI first, then run a test. Matching elements get a <strong>bright outline</strong> for 5 seconds.<br>
        ESC pins/unpins this app.
      </div>
    </main>
  </section>

  <script>
    (() => {
      "use strict";

      const POSITION_KEY = "hammyMenu.position.v1";
      const SETTINGS_KEY = "hammyMenu.settings.v1";

      const state = {
        sendCount: 0,
        eventCount: 0,
        settings: {
          enabled: true,
          autoApply: true
        }
      };

      const $ = id => document.getElementById(id);

      const FULL_CSS = `
        .div_money,.div_bmoney,.div_job{
          background:rgba(8,12,18,.96)!important;
          border:1px solid rgba(255,255,255,.09)!important;
          border-radius:10px!important;
          box-shadow:0 12px 30px rgba(0,0,0,.32)!important;
          padding:9px 11px!important;
          color:#edf6ff!important;
          font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif!important;
          font-size:13px!important;
          font-weight:800!important;
          text-shadow:none!important;
        }

        .div_money{border-color:rgba(52,211,153,.18)!important}
        .div_bmoney{border-color:rgba(56,189,248,.18)!important}
        .div_job{border-color:rgba(251,191,36,.18)!important}

        .menu{
          background:rgba(8,12,18,.97)!important;
          border:1px solid rgba(255,255,255,.10)!important;
          border-radius:12px!important;
          box-shadow:0 14px 40px rgba(0,0,0,.38)!important;
          overflow:hidden!important;
          font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif!important;
        }

        .menu h1{
          margin:0!important;
          padding:10px 12px!important;
          background:rgba(15,23,34,.98)!important;
          border:0!important;
          border-bottom:1px solid rgba(255,255,255,.08)!important;
          color:#edf6ff!important;
          font-size:13px!important;
          font-weight:900!important;
          text-shadow:none!important;
        }

        .menu .choices{
          padding:6px!important;
          background:rgba(8,12,18,.97)!important;
        }

        .menu .choices > div{
          margin:3px 0!important;
          padding:8px 10px!important;
          border:1px solid transparent!important;
          border-radius:8px!important;
          background:rgba(255,255,255,.035)!important;
          color:#dfeaf5!important;
          font-size:12px!important;
          transition:background .12s ease,border-color .12s ease!important;
        }

        .menu .choices > div:hover,
        .menu .choices > div.selected{
          background:rgba(56,189,248,.10)!important;
          border-color:rgba(56,189,248,.20)!important;
          color:#ffffff!important;
        }

        /* Keep embedded widgets (inventory weight/progress bars, etc.) from
           inheriting menu-row card styling. */
        .menu .choices > div div{
          border-radius:inherit;
        }

        .menu_description{
          background:rgba(8,12,18,.97)!important;
          border:1px solid rgba(255,255,255,.09)!important;
          border-radius:10px!important;
          box-shadow:0 12px 30px rgba(0,0,0,.32)!important;
          padding:9px 11px!important;
          color:#cbd8e6!important;
          font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif!important;
          font-size:11px!important;
          line-height:1.4!important;
          text-shadow:none!important;
        }
      `;

      const TEST_CSS = `
        .menu{
          outline:3px solid #38bdf8!important;
          outline-offset:3px!important;
          box-shadow:0 0 26px rgba(56,189,248,.8)!important;
        }
      `;

      const PLAYER_TEST_CSS = `
        .playerlist,.player-list,.players,.players-list,.player_list,
        #playerlist,#player-list,#players,#players-list,
        [class*="playerlist"],[class*="player-list"],[class*="players-list"],
        [id*="playerlist"],[id*="player-list"]{
          outline:3px solid #34d399!important;
          outline-offset:3px!important;
          box-shadow:0 0 26px rgba(52,211,153,.8)!important;
        }
      `;

      const CHAT_TEST_CSS = `
        .chat,.chatbox,.chat-box,.chatInput,.chat-input,.chatbox-input,
        #chat,#chatbox,#chat-box,#chatInput,#chat-input,
        input[type="text"],textarea,
        [class*="chat"],[id*="chat"]{
          outline:3px solid #fbbf24!important;
          outline-offset:3px!important;
          box-shadow:0 0 26px rgba(251,191,36,.75)!important;
        }
      `;

      const SCOPE_TEST_CSS = `
        html,body,body *,div,section,main,aside,nav,ul,ol,li,table,tr,td,
        input,textarea,button{
          outline:1px solid rgba(251,113,133,.9)!important;
          outline-offset:-1px!important;
        }
      `;

      function setStatus(title, text, kind = "") {
        const box = $("status");
        box.className = "status" + (kind ? " " + kind : "");
        $("statusTitle").textContent = title;
        $("statusText").textContent = text;
      }

      function renderCounters() {
        $("sendCount").textContent = String(state.sendCount);
        $("eventCount").textContent = String(state.eventCount);
      }

      function sendCss(css, label) {
        window.parent.postMessage({
          type: "setDivCss",
          div: "additional_css",
          css
        }, "*");

        state.sendCount += 1;
        renderCounters();
        console.log("[Hammy Menu] setDivCss:", label, { length: css.length });
      }

      function applyStyles() {
        if (!state.settings.enabled) {
          setStatus("Styling disabled", "Enable HUD styling first.", "error");
          return;
        }

        sendCss(FULL_CSS, "full");
        setStatus(
          "Styles sent",
          "Sent the Hammy HUD/menu stylesheet to TT via setDivCss.",
          "ok"
        );

        window.parent.postMessage({
          type: "notification",
          text: "~b~[Hammy Menu]~w~ HUD styles sent."
        }, "*");
      }

      function testInjection() {
        sendCss(TEST_CSS, "test");
        setStatus(
          "Test CSS sent",
          "Open a TT menu now. It should have a bright cyan outline for 4 seconds.",
          "busy"
        );

        setTimeout(() => {
          if (state.settings.enabled) {
            sendCss(FULL_CSS, "restore-after-test");
            setStatus("Test finished", "Restored the Hammy menu stylesheet.", "ok");
          } else {
            sendCss("", "clear-after-test");
            setStatus("Test finished", "Cleared the temporary test stylesheet.", "ok");
          }
        }, 4000);
      }

      function temporaryTest(css, label, title, text) {
        sendCss(css, label);
        setStatus(title, text, "busy");

        setTimeout(() => {
          if (state.settings.enabled) {
            sendCss(FULL_CSS, "restore-after-" + label);
            setStatus("Test finished", "Restored the Hammy menu stylesheet.", "ok");
          } else {
            sendCss("", "clear-after-" + label);
            setStatus("Test finished", "Cleared the temporary test stylesheet.", "ok");
          }
        }, 5000);
      }

      function testPlayerList() {
        temporaryTest(
          PLAYER_TEST_CSS,
          "player-list-test",
          "Player List test sent",
          "Open the TT Player List. Matching containers should glow green for 5 seconds."
        );
      }

      function testChat() {
        temporaryTest(
          CHAT_TEST_CSS,
          "chat-test",
          "Chat/Input test sent",
          "Keep chat open or focus the text box. Matching elements should glow amber for 5 seconds."
        );
      }

      function testScope() {
        temporaryTest(
          SCOPE_TEST_CSS,
          "scope-test",
          "Scope test sent",
          "Reachable TT UI should show red outlines for 5 seconds. Check Player List and chat specifically."
        );
      }

      function resetStyles() {
        sendCss("", "reset");
        setStatus(
          "Injected CSS cleared",
          "Sent an empty additional_css stylesheet to TT.",
          "ok"
        );

        window.parent.postMessage({
          type: "notification",
          text: "~r~[Hammy Menu]~w~ Injected HUD CSS cleared."
        }, "*");
      }

      function saveSettings() {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
        } catch {}
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
          if (saved && typeof saved === "object") {
            if (typeof saved.enabled === "boolean") state.settings.enabled = saved.enabled;
            if (typeof saved.autoApply === "boolean") state.settings.autoApply = saved.autoApply;
          }
        } catch {}

        $("enabled").checked = state.settings.enabled;
        $("autoApply").checked = state.settings.autoApply;
      }

      function setupDrag() {
        const app = $("app");
        const handle = $("dragHandle");

        try {
          const saved = JSON.parse(localStorage.getItem(POSITION_KEY) || "null");
          if (saved) {
            app.style.left = Math.max(0, Math.min(saved.x, window.innerWidth - app.offsetWidth)) + "px";
            app.style.top = Math.max(0, Math.min(saved.y, window.innerHeight - app.offsetHeight)) + "px";
          }
        } catch {}

        let dragging = false;
        let dx = 0;
        let dy = 0;

        handle.addEventListener("mousedown", event => {
          if (event.target.closest("button,input,label")) return;
          const rect = app.getBoundingClientRect();
          dragging = true;
          dx = event.clientX - rect.left;
          dy = event.clientY - rect.top;
          event.preventDefault();
        });

        document.addEventListener("mousemove", event => {
          if (!dragging) return;
          app.style.left = Math.max(0, Math.min(event.clientX - dx, window.innerWidth - app.offsetWidth)) + "px";
          app.style.top = Math.max(0, Math.min(event.clientY - dy, window.innerHeight - app.offsetHeight)) + "px";
        });

        document.addEventListener("mouseup", () => {
          if (!dragging) return;
          dragging = false;
          try {
            localStorage.setItem(POSITION_KEY, JSON.stringify({
              x: app.offsetLeft,
              y: app.offsetTop
            }));
          } catch {}
        });
      }

      window.addEventListener("message", event => {
        if (!event.data) return;
        state.eventCount += 1;
        renderCounters();
        console.log("[Hammy Menu] parent event:", event.data);
      });

      window.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          window.parent.postMessage({ type: "pin" }, "*");
        }
      });

      $("enabled").addEventListener("change", event => {
        state.settings.enabled = event.target.checked;
        saveSettings();

        if (state.settings.enabled) {
          applyStyles();
        } else {
          resetStyles();
        }
      });

      $("autoApply").addEventListener("change", event => {
        state.settings.autoApply = event.target.checked;
        saveSettings();
      });

      $("applyBtn").addEventListener("click", applyStyles);
      $("testBtn").addEventListener("click", testInjection);
      $("testPlayersBtn").addEventListener("click", testPlayerList);
      $("testChatBtn").addEventListener("click", testChat);
      $("scopeBtn").addEventListener("click", testScope);
      $("resetBtn").addEventListener("click", resetStyles);

      loadSettings();
      setupDrag();
      renderCounters();

      window.parent.postMessage({ type: "getData" }, "*");

      setTimeout(() => {
        if (state.settings.enabled && state.settings.autoApply) {
          applyStyles();
        }
      }, 500);
    })();
  </script>
</body>
</html>
