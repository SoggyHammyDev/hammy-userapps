<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Business Reminder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b111a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="reminder" class="reminder">
    <header id="dragHandle">
      <div class="brand">
        <span class="icon">💰</span>
        <div>
          <div class="title-row">
            <strong>Business Reminder</strong>
            <span>3H</span>
          </div>
          <small>Business bonus collection timer</small>
        </div>
      </div>
      <button id="minimizeBtn" type="button" title="Minimize">−</button>
    </header>

    <main id="content">
      <section id="timerView" class="timer-view">
        <span class="eyebrow">Next Collection</span>
        <strong id="countdown">03:00:00</strong>
        <span id="nextTime" class="next-time">Not started</span>

        <div class="progress"><div id="progressFill"></div></div>

        <div class="actions">
          <button id="startBtn" class="primary" type="button">Start 3 Hour Timer</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
      </section>

      <section id="alertView" class="alert-view" hidden>
        <div class="alert-icon">🏢</div>
        <span class="alert-kicker">BUSINESSES READY</span>
        <strong>Collect your businesses!</strong>
        <p>Your 3-hour collection timer has finished.</p>
        <button id="collectedBtn" class="primary wide" type="button">Collected — Restart 3 Hours</button>
      </section>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
