<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Hammy RTS Manager</title>
  <style>
    :root{
      --bg:rgba(10,14,21,.985);
      --bg2:rgba(17,24,35,.985);
      --surface:rgba(255,255,255,.045);
      --surface2:rgba(255,255,255,.065);
      --line:rgba(255,255,255,.09);
      --text:#edf6ff;
      --muted:#8192a8;
      --blue:#38bdf8;
      --cyan:#22d3ee;
      --green:#34d399;
      --red:#fb7185;
      --amber:#fbbf24;
      --radius:13px;
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;height:100%;margin:0;overflow:hidden;
      background:transparent;color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    button,input{font:inherit}

    #tracker{
      position:fixed;
      top:50px;left:50px;
      width:390px;
      max-width:92vw;
      z-index:9999;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(145deg,var(--bg),var(--bg2));
      box-shadow:0 18px 55px rgba(0,0,0,.42);
      user-select:none;
    }

    #tracker.minimized{
      width:285px;
    }

    .header{
      min-height:48px;
      padding:7px 9px;
      display:flex;
      align-items:center;
      gap:9px;
      border-bottom:1px solid var(--line);
      cursor:grab;
    }
    .header:active{cursor:grabbing}

    .app-icon{
      width:31px;height:31px;
      display:grid;place-items:center;
      flex:none;
      border-radius:9px;
      background:rgba(56,189,248,.10);
      border:1px solid rgba(56,189,248,.18);
      font-size:14px;
    }

    .header-copy{min-width:0}
    .header-title-row{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }
    .version-badge{
      color:var(--cyan);
      font-size:8px;
      font-weight:900;
    }
    .header-sub{
      margin-top:1px;
      color:var(--muted);
      font-size:9px;
      white-space:nowrap;
    }

    .header-actions{
      margin-left:auto;
      display:flex;
      gap:4px;
    }
    .minimize-btn{
      width:28px;height:28px;padding:0;
      display:grid;place-items:center;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.045);
      color:var(--text);
      cursor:pointer;
      font-size:12px;
    }
    .minimize-btn:hover{background:rgba(255,255,255,.09)}

    .content{
      padding:8px;
      display:grid;
      gap:8px;
    }
    #tracker.minimized .content{display:none}

    .summary-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
    }
    .summary-card{
      min-width:0;
      padding:9px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface);
    }
    .summary-label{
      display:block;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.065em;
      font-size:7px;
      font-weight:850;
    }
    .summary-value{
      display:block;
      margin-top:4px;
      color:#eaf4ff;
      font-size:13px;
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .status.enabled .summary-value{color:var(--green)}
    .status.disabled .summary-value{color:var(--red)}

    .mode-list{
      display:grid;
      gap:7px;
    }
    .mode-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:9px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--surface);
    }
    .mode-row:hover{background:var(--surface2)}
    .mode-copy{min-width:0}
    .mode-title{
      color:#e7f0fa;
      font-size:10px;
      font-weight:800;
    }
    .mode-desc{
      margin-top:2px;
      color:var(--muted);
      font-size:8px;
      line-height:1.35;
    }

    .switch{
      position:relative;
      width:34px;height:20px;
      flex:none;
    }
    .switch input{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }
    .switch-track{
      position:absolute;
      inset:0;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.06);
      cursor:pointer;
      transition:background .15s ease,border-color .15s ease;
    }
    .switch-track::after{
      content:"";
      position:absolute;
      width:14px;height:14px;
      left:2px;top:2px;
      border-radius:50%;
      background:#9aabba;
      transition:transform .15s ease,background .15s ease;
    }
    .switch input:checked + .switch-track{
      background:rgba(56,189,248,.16);
      border-color:rgba(56,189,248,.34);
    }
    .switch input:checked + .switch-track::after{
      transform:translateX(14px);
      background:var(--cyan);
    }

    .action-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
    }
    .btn{
      min-height:34px;
      padding:7px 9px;
      border-radius:9px;
      border:1px solid var(--line);
      cursor:pointer;
      color:var(--text);
      font-size:9px;
      font-weight:800;
    }
    .btn:disabled{
      opacity:.38;
      cursor:not-allowed;
    }
    .btn-danger{
      background:rgba(251,113,133,.075);
      border-color:rgba(251,113,133,.20);
      color:#ffd7df;
    }
    .btn-danger:hover:not(:disabled){background:rgba(251,113,133,.13)}
    .btn-primary{
      background:rgba(56,189,248,.075);
      border-color:rgba(56,189,248,.20);
      color:#daf4ff;
    }
    .btn-primary:hover:not(:disabled){background:rgba(56,189,248,.13)}

    .footnote{
      padding:0 2px 1px;
      color:var(--muted);
      font-size:7px;
      line-height:1.4;
    }

    @media(max-width:420px){
      #tracker{
        width:94vw;
        left:10px;
        top:10px;
      }
      .action-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <section id="tracker" aria-label="RTS Card Manager">
    <header class="header" aria-grabbed="false">
      <span class="app-icon">🚛</span>
      <div class="header-copy">
        <div class="header-title-row">
          <span>RTS Manager</span>
          <span class="version-badge">v2</span>
        </div>
        <div class="header-sub">Card automation</div>
      </div>
      <div class="header-actions">
        <button class="minimize-btn" id="minimize-btn" aria-label="Minimize panel">−</button>
      </div>
    </header>

    <div class="content">
      <div class="summary-grid">
        <div class="summary-card status disabled" id="status" aria-live="polite">
          <span class="summary-label">Mode</span>
          <span class="summary-value">Disabled</span>
        </div>
        <div class="summary-card rts-count" id="rts-count">
          <span class="summary-label">RTS Cards</span>
          <span class="summary-value">0</span>
        </div>
      </div>

      <div class="mode-list">
        <div class="mode-row">
          <div class="mode-copy">
            <div class="mode-title">Auto Delete</div>
            <div class="mode-desc">Automatically trash newly detected RTS cards.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="auto-delete-checkbox" aria-label="Toggle auto delete">
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="mode-row">
          <div class="mode-copy">
            <div class="mode-title">Auto Backpack</div>
            <div class="mode-desc">Automatically move newly detected RTS cards to your backpack.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="auto-backpack-checkbox" aria-label="Toggle auto backpack">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <div class="action-grid">
        <button class="btn btn-danger" id="manual-delete">Delete All</button>
        <button class="btn btn-primary" id="manual-backpack">Backpack All</button>
      </div>

      <div class="footnote">
        Auto modes are session-only and remain mutually exclusive.
      </div>
    </div>
  </section>

  <script src="app.js?v=20260920"></script>
</body>
</html>
